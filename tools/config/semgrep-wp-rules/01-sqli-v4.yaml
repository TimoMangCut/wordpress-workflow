rules:
  # =============================================================================
  # SQL INJECTION - WordPress (v5 - Full REST API Sources)
  # CWE-89: SQL Injection
  # Updated: 2026-02 - Added complete WP_REST_Request methods
  # REST API data is UNSLASHED — bypasses wp_magic_quotes() protection
  # =============================================================================

  - id: wp-sqli-wpdb-query-v4
    mode: taint
    languages: [php]
    severity: WARNING
    message: >-
      SQL Injection: User input flows into wpdb query without prepare().
      Use wpdb->prepare() with placeholders (%d, %s, %f).
    metadata:
      cwe: ["CWE-89"]
      owasp: ["A03:2021 - Injection"]
      category: security
      technology: [wordpress]
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH

    pattern-sources:
      # Standard PHP superglobals
      - pattern: $_GET
      - pattern: $_POST
      - pattern: $_REQUEST
      - pattern: $_COOKIE
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
      - pattern: $_COOKIE[...]
      # WordPress specific
      - pattern: $atts
      - pattern: $atts[...]
      - pattern: file_get_contents("php://input")
      # REST API (ALL data UNSLASHED — bypasses wp_magic_quotes)
      - pattern: $request->get_param(...)
      - pattern: $request->get_params()
      - pattern: $request->get_json_params()
      - pattern: $request->get_body()
      - pattern: $request->get_body_params()
      - pattern: $request->get_query_params()
      - pattern: $request->get_url_params()
      - pattern: $request->get_header(...)
      - pattern: $request->get_headers()
      - pattern: $request[...]

    pattern-sinks:
      - pattern: $wpdb->query(...)
      - pattern: $wpdb->get_var(...)
      - pattern: $wpdb->get_row(...)
      - pattern: $wpdb->get_col(...)
      - pattern: $wpdb->get_results(...)

    pattern-sanitizers:
      # SQL specific
      - pattern: $wpdb->prepare(...)
      - pattern: esc_sql(...)
      - pattern: $wpdb->esc_like(...)
      - pattern: $wpdb->insert(...)
      - pattern: $wpdb->update(...)
      - pattern: $wpdb->delete(...)
      - pattern: $wpdb->replace(...)
      # Numeric casting (critical for SQLi)
      - pattern: absint(...)
      - pattern: intval(...)
      - pattern: (int)$X
      - pattern: floatval(...)
      - pattern: (float)$X
      # String sanitizers
      - pattern: sanitize_text_field(...)
      - pattern: sanitize_key(...)
      - pattern: sanitize_title(...)
      - pattern: esc_attr(...)
      - pattern: esc_html(...)
      # WooCommerce sanitizers
      - pattern: wc_clean(...)
      - pattern: wc_sanitize_textarea(...)
      - pattern: wc_stock_amount(...)
      - pattern: wc_sanitize_taxonomy_name(...)
      # Give sanitizers
      - pattern: give_clean(...)
      - pattern: give_sanitize_amount(...)
      - pattern: give_sanitize_amount_for_db(...)
      - pattern: give_maybe_sanitize_amount(...)
      # Type validation
      - pattern: is_numeric(...)
      - pattern: wp_parse_id_list(...)
      - pattern: boolval(...)
      - pattern: (bool)$X
