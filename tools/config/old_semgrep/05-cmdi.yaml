rules:
  # =============================================================================
  # COMMAND INJECTION - WordPress/PHP
  # CWE-78: OS Command Injection
  # Equivalent to baseline: cmdi.yaml
  # =============================================================================

  - id: wp-command-injection
    mode: taint
    languages: [php]
    severity: WARNING
    message: >-
      OS Command Injection: User input in shell command execution.
      Use escapeshellarg() for arguments, escapeshellcmd() for commands.
    metadata:
      cwe: ["CWE-78"]
      owasp: ["A03:2021 - Injection"]
      category: security
      technology: [wordpress]
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      references:
        - https://owasp.org/www-community/attacks/Command_Injection

    pattern-sources:
      - pattern: $_GET
      - pattern: $_POST
      - pattern: $_REQUEST
      - pattern: $_COOKIE
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
      - pattern: $_COOKIE[...]
      - pattern: file_get_contents("php://input")

    pattern-sinks:
      - pattern: exec($CMD, ...)
      - pattern: shell_exec($CMD)
      - pattern: system($CMD, ...)
      - pattern: passthru($CMD, ...)
      - pattern: popen($CMD, ...)
      - pattern: proc_open($CMD, ...)

    pattern-sanitizers:
      - pattern: escapeshellarg(...)
      - pattern: escapeshellcmd(...)
      - pattern: absint(...)
      - pattern: intval(...)
      - pattern: (int)$X
      - pattern: is_numeric(...)
      - pattern: sanitize_key(...)
